[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-ingest"
version = "0.1.0"
description = "Restricted local ingestion and de-identification tool for neuroradiology teaching cases"
requires-python = ">=3.13"
# Runtime and test dependencies are pinned in requirements.txt.

[tool.setuptools]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    "error::PIL.Image.DecompressionBombWarning",
]
